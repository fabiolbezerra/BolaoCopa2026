<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition
        template="/template.xhtml"
        xmlns="http://www.w3.org/1999/xhtml"
        xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
        xmlns:p="http://primefaces.org/ui"
        xmlns:h="http://java.sun.com/jsf/html" xmlns:f="http://java.sun.com/jsf/core">
    <ui:define name="title">
        Cadastro de Partida
    </ui:define>

    <ui:define name="content">
        <h1>Cadastrar Partida</h1>

        <br/>

        <h:form>
            <p:panelGrid styleClass="ui-noborder" columns="2">

                <f:facet name="header">
                    Dados da partida
                </f:facet>

            <p:outputLabel
                    value="Data"/>
            <p:inputText
                id="Data"
                value="#{partidaBean.partida.inicioDaPartida}"
                required="true"
                requiredMessage="Informe a data da partida" />

            <p:outputLabel
                    value="Local"
                    for = "local"/>
            <p:inputText
                 id="local"
                 value="#{partidaBean.partida.local}"
                 required="true"
                 requiredMessage="Informe o local da partida" />

            <p:outputLabel
                    value="Fase"
                    for = "fase"/>
            <p:selectOneMenu
                    id = "fase"
                    value="#{partidaBean.partida.fase}"
                    converter="faseConverter"
                    required = "true"
                    style = "width: 100%">
                <f:selectItem
                        itemLabel="Selecione..."
                        itemValue="" noSelectionOption="false"/>
                <f:selectItems
                        value="#{faseBean.fases}"
                        var="f"
                        itemLabel="#{f.nome}"
                        itemValue="#{f}"/>
            </p:selectOneMenu>

            <p:outputLabel
                    value="Seleção A"/>
            <p:selectOneMenu
                    value="#{partidaBean.partida.selecaoA}"

                    converter="selecaoConverter">
                <f:selectItem
                        itemLabel="Selecione..."
                        itemValue=""
                        noSelectionOption="true"/>
                <f:selectItems
                        value="#{selecaoBean.selecoes}"
                        var="s" itemLabel="#{s.nome}"
                        itemValue="#{s}"/>
            </p:selectOneMenu>

            <p:outputLabel
                    value="Seleção B"/>
            <p:selectOneMenu
                    value="#{partidaBean.partida.selecaoB}"

                    converter="selecaoConverter">
                <f:selectItem
                        itemLabel="Selecione..."
                        itemValue=""
                        noSelectionOption="true"/>
                <f:selectItems
                        value="#{selecaoBean.selecoes}"
                        var="s"
                        itemLabel="#{s.nome}"
                        itemValue="#{s}"/>
            </p:selectOneMenu>

        </p:panelGrid>

            <br/>

            <p:commandButton
                    value="Salvar Partida"
                    action="#{partidaBean.salvar}"
                    update="@form"
                    icon="pi pi-save" />

            <p:commandButton
                    value="Cancelar"
                    action="/palpiteiro/partida/lista.xhtml"
                    update="@form"
                    icon="pi pi-times" />
        </h:form>

    </ui:define>
</ui:composition>
