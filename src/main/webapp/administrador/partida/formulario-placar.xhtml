<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition
        template="/template.xhtml"
        xmlns="http://www.w3.org/1999/xhtml"
        xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
        xmlns:p="http://primefaces.org/ui"
        xmlns:h="http://java.sun.com/jsf/html" xmlns:f="http://java.sun.com/jsf/core">

    <ui:define name="title">
        Placar da partida
    </ui:define>

    <ui:define name="content">
        <h1>Atualizar placar da Partida</h1>

        <h:form>

            <br>
        <h:inputHidden value="#{partidaBean.partida.id}"/>
        <p:panel header="Dados da partida">
            <p:panelGrid styleClass="ui-noborder" columns ="2" columnClass="label-col, value,col" style="width: 100%">
                <h:outputText value="Fase:"/>
                <h:outputText value="#{partidaBean.partida.fase != null ? partidaBean.partida.fase.nome : 'Não informada'}"/>

                <h:outputText value="Data e Hora:"/>
                <h:outputText value="#{partidaBean.partida.inicioDaPartida}">
                    <f:convertDateTime pattern="dd/MM/yyyy HH:mm" timeZone="GMT-3"/>
                </h:outputText>

                <h:outputText value="Local:"/>
                <h:outputText value="#{partidaBean.partida.local != null ? partidaBean.partida.local : 'Sem local determinado'}"/>
            </p:panelGrid>
        </p:panel>

        </br>

        <p:panel header="Placar da partida">
            <p:messages autoupdate="true" style="width: 100%"/>

            <h:outputText value="Defina o resultado da partida"/>
            <h:panelGrid columns="3" style="width: 50%; margin: 0 auto; text-align: center;"
                         columnClasses="selecao-col, placar-col, selecao-col">

                <h:outputText
                        value="#{partidaBean.partida.selecaoA != null ? partidaBean.partida.selecaoA.nome : ''}"
                        style="font-weight: bold; display: block;"/>
                <h:outputText value=""/>
                <h:outputText
                        value="#{partidaBean.partida.selecaoB != null ? partidaBean.partida.selecaoB.nome : ''}"
                        style="font-weight: bold; display: block;"/>

                <p:graphicImage value="/resources/imagens/#{partidaBean.partida.selecaoA.simbolo}" width="32px"/>
                <h:outputText value="x"
                              style="font-weight: bold; font-size: 1.5em; display: block; text-align: center;"/>
                <p:graphicImage value="/resources/imagens/#{partidaBean.partida.selecaoB.simbolo}" width="32px"/>

                <p:spinner value="#{partidaBean.partida.golsA}"
                           stepFactor="1"
                           min="0"
                           style="width: 60px; text-align: center;"
                           required="true"
                           requiredMessage="Informe os gols"/>
                <h:outputText value=""/>
                <p:spinner value="#{partidaBean.partida.golsB}"
                           stepFactor="1"
                           min="0"
                           style="width: 60px; text-align: center;"
                           required="true"
                           requiredMessage="Informe os gols"/>

            </h:panelGrid>

            <br/>

            <h:panelGrid columns="2" cellpadding="5"
                         rendered="#{partidaBean.partida.fase.eliminatoria}">

                <h:outputText value="Tipo de Vitória:"/>
                <p:selectOneMenu value="#{partidaBean.partida.tipoDeVitoria}">
                    <f:selectItem itemLabel="Selecione..." itemValue="#{null}"/>
                    <f:selectItems value="#{palpiteBean.tiposDeVitoria}"
                                   var="tipo"
                                   itemLabel="#{tipo.descricao}"
                                   itemValue="#{tipo}"/>
                </p:selectOneMenu>
            </h:panelGrid>



            <p:commandButton value="Salvar"
                             icon="fa fa-floppy-o"
                             action="#{partidaBean.salvar}"
                             update="@form"/>

            <p:button value="Cancelar"
                      icon="fa fa-ban"
                      outcome="/palpiteiro/partida/lista.xhtml"/>
        </p:panel>
        </h:form>

    </ui:define>
</ui:composition>
