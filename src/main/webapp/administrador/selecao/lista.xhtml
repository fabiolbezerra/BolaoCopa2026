<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition
        template="/template.xhtml"
        xmlns="http://www.w3.org/1999/xhtml"
        xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
        xmlns:p="http://primefaces.org/ui"
        xmlns:h="http://java.sun.com/jsf/html">
    <ui:define name="title">
        Seleções
    </ui:define>

    <ui:define name="content">
        <h1>Lista de seleções</h1>

        <h:form>
            <div class="ui-g">
                <div class="ui-g-6">
                    <p:dataTable value="#{selecaoBean.selecoes}" var="s">
                        <p:column headerText="Nome">
                            <h:outputText value="#{s.nome}"/>
                        </p:column>

                        <p:column headerText="Símbolo">
                            <p:graphicImage value="/resources/imagens/#{s.simbolo}" width="24px"/>
                        </p:column>

                        <p:column headerText="Sigla">
                            <h:outputText value="#{s.sigla}"/>
                        </p:column>

                        <p:column headerText="Grupo">
                            <h:outputText value="#{s.grupo.nome}"/>
                        </p:column>
                    </p:dataTable>
                </div>
                <div class="ui-g-6">

                </div>
            </div>
        </h:form>

    </ui:define>
</ui:composition>
