<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition
        template="/template.xhtml"
        xmlns="http://www.w3.org/1999/xhtml"
        xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
        xmlns:p="http://primefaces.org/ui"
        xmlns:h="http://java.sun.com/jsf/html" xmlns:f="http://java.sun.com/jsf/core">
    <ui:define name="title">
        Usuários
    </ui:define>

    <ui:define name="content">
        <h1>Usuários Banidos</h1>

        <h:form>
            <p:dataTable id="dtUsuarios"
                         value="#{gerenciarUsuarioBean.usuariosBanidos}"
                         var="usuario"
                         selectionMode="single"
                         selection="#{gerenciarUsuarioBean.usuario}"
                         rowKey="#{usuario.id}"
                         emptyMessage="Lista de usuários vazia">

                <p:column headerText="Nome" sortBy="#{usuario.nome}">
                    <h:outputText value="#{usuario.nome} #{usuario.sobrenome}"/>
                </p:column>

                <p:column headerText="Campus" sortBy="#{usuario.campus.nome}">
                    <h:outputText value="#{usuario.campus.nome}"/>
                </p:column>

                <p:column headerText="Curso">
                    <h:outputText value="#{usuario.curso.nome}"/>
                </p:column>

                <p:column headerText="E-mail">
                    <h:outputText value="#{usuario.email}"/>
                </p:column>

                <p:column headerText="Tipo">
                    <h:outputText value="#{usuario.tipo.descricao}"/>
                </p:column>

                <p:column headerText="Data do Banimento">
                    <h:outputText value="#{usuario.dataBanimento}">
                        <f:convertDateTime pattern="dd/MM/yyyy HH:mm" timeZone="GMT-3"/>
                    </h:outputText>
                </p:column>

                <p:column headerText="Justificativa do Banimento">
                    <h:outputText value="#{usuario.justificativaBanimento}"/>
                </p:column>
            </p:dataTable>

        </h:form>

    </ui:define>
</ui:composition>
