<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition
        template="/template.xhtml"
        xmlns="http://www.w3.org/1999/xhtml"
        xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
        xmlns:p="http://primefaces.org/ui"
        xmlns:h="http://java.sun.com/jsf/html"
        xmlns:f="http://java.sun.com/jsf/core"
        xmlns:c="http://java.sun.com/jsp/jstl/core"
>
    <ui:define name="title">
        Fases da Copa
    </ui:define>

    <ui:define name="content">
        <h1>Fases da Copa do Mundo</h1>

        <h:form>
            <div class="ui-g">
                <div class="ui-g-6">
                    <p:dataTable value="#{faseBean.fases}" var="f">
                        <p:column headerText="Nome">
                            <h:outputText value="#{f.nome}"/>
                        </p:column>

                        <p:column headerText="Eliminatória?">
                            <h:outputText value="Sim" rendered="#{f.eliminatoria}" />
                            <h:outputText value="Não" rendered="#{not f.eliminatoria}" />
                        </p:column>

                        <p:column headerText="Início">
                            <h:outputText value="#{f.inicio}">
                                <f:convertDateTime type="date" pattern="dd/MM/yyyy"/>
                            </h:outputText>
                        </p:column>

                        <p:column headerText="fim">
                            <h:outputText value="#{f.fim}">
                                <f:convertDateTime type="date" pattern="dd/MM/yyyy"/>
                            </h:outputText>
                        </p:column>
                    </p:dataTable>
                </div>
                <div class="ui-g-6">
                </div>
            </div>
        </h:form>

    </ui:define>
</ui:composition>
