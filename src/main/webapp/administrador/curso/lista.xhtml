<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition
        template="/template.xhtml"
        xmlns="http://www.w3.org/1999/xhtml"
        xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
        xmlns:p="http://primefaces.org/ui"
        xmlns:h="http://java.sun.com/jsf/html">
    <ui:define name="title">
        Cursos
    </ui:define>

    <ui:define name="content">
        <h1>Lista de cursos</h1>

        <h:form>
            <div class="ui-g">
                <div class="ui-g-6">
                    <p:dataTable value="#{cursoBean.cursos}" var="c">
                        <p:column headerText="Nome" sortBy="#{c.nome}">
                            <h:outputText value="#{c.nome}" />
                        </p:column>

                        <p:column headerText="Sigla" width="20%">
                            <h:outputText value="#{c.sigla}"/>
                        </p:column>

                        <p:column headerText="Campus" sortBy="#{c.campus.nome}" width="30%">
                            <h:outputText value="#{c.campus.nome}"/>
                        </p:column>
                    </p:dataTable>
                </div>
                <div class="ui-g-6">

                </div>
            </div>
        </h:form>

    </ui:define>
</ui:composition>
