<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition
        template="/template.xhtml"
        xmlns="http://www.w3.org/1999/xhtml"
        xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
        xmlns:p="http://primefaces.org/ui"
        xmlns:h="http://java.sun.com/jsf/html">
    <ui:define name="title">
        Login no Bolão
    </ui:define>

    <ui:define name="top">
        <h:outputText value="Bolão da Copa do Mundo 2026" style="font-size: x-large"/>
        <br/>
        Entretendo Palpiteiros da UFRA na Copa do Mundo de 2026
    </ui:define>

    <ui:define name="content">
        <!-- Script com a função solicitada -->
        <h:outputScript>
            function submeter() {
            var form = document.getElementById('formLogin');
            form.action = '#{request.contextPath}/j_spring_security_check';
            form.method = 'POST';
            form.submit();
            }
        </h:outputScript>

        <h:form id="formLogin" prependId="false">
            <div align="center">
                <h2>Login</h2>

                <hr width="15%"/>

                <h:outputText value="#{session.getAttribute('SPRING_SECURITY_LAST_EXCEPTION').message}"
                              rendered="#{session.getAttribute('SPRING_SECURITY_LAST_EXCEPTION') != null}"
                              style="color: red; font-size: 1.2em; "/>

                <div class="ui-g-12">
                    <p:inputText id="j_username"
                                 name="j_username"
                                 placeholder="E-mail"
                                 required="true"/>
                </div>

                <br/>

                <div class="ui-g-12">
                    <p:password id="j_password"
                                name="j_password"
                                placeholder="Senha"
                                required="true"
                                feedback="false"/>
                </div>

                <hr width="15%"/>

                <!-- Botão chamando a função submeter() no onclick -->
                <div class="ui-g-12 button-container">
                    <p:commandButton type="button"
                                     onclick="submeter();"
                                     icon="fa fa-sign-in"
                                     value="Acessar"
                    />
                    <br/><br/>
                    <p:link value="Esqueci minha senha" outcome="formulario-redefinir-senha.xhtml"/>
                </div>

                <br/>
                <br/>
                <br/>
            </div>
        </h:form>
    </ui:define>
</ui:composition>
