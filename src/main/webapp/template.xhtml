<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui">

<h:head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
    <h:outputStylesheet name="/css/default.css"/>
    <h:outputStylesheet name="/css/cssLayout.css"/>
    <title>
        <ui:insert name="title">
            Título da Página
        </ui:insert>
    </title>
</h:head>

<h:body>

    <div id="top" class="top">
        <ui:insert name="top">
            Olá #{usuarioBean.usuarioLogado.nome} #{usuarioBean.usuarioLogado.sobrenome}!

            <!-- Painel Centralizado Corretamente -->
            <p:outputPanel style="position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); text-align: center;" rendered="#{usuarioBean.palpiteiro}">
                <p:outputLabel value="Pontuação: #{usuarioBean.usuarioLogado.pontuacao}"/> <br/>
                <p:outputLabel value="Posição: #{usuarioBean.usuarioLogado.posicao}"/>
            </p:outputPanel>

            <!-- Painel da Direita (Mantendo o Float Original) -->
            <p:outputPanel style="float: right; display: flex; gap: 5px; align-items: center;">
                <p:link value="Início" outcome="#{usuarioBean.usuarioLogado.perfil.pagina}"/>
                <h:outputText value=" | "/>
                <p:link value="Sair" href="#{request.contextPath}/j_spring_security_logout"/>
            </p:outputPanel>

            <br/>

            #{usuarioBean.usuarioLogado.perfil.descricao}

            <br/>

            #{usuarioBean.usuarioLogado.campus.nome}
        </ui:insert>
    </div>


    <div id="content" class="center_content">
        <ui:insert name="content">
            Content
        </ui:insert>
    </div>

</h:body>

</html>
