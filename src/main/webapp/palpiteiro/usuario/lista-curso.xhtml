<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition
        template="/template.xhtml"
        xmlns="http://www.w3.org/1999/xhtml"
        xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
        xmlns:p="http://primefaces.org/ui"
        xmlns:h="http://java.sun.com/jsf/html"
        xmlns:f="http://java.sun.com/jsf/core"
        xmlns:c="http://java.sun.com/jsp/jstl/core">

    <ui:define name="title">Ranking por Curso</ui:define>

    <ui:define name="content">
        <h:form>
            <c:choose>
                <c:when test="#{usuarioBean.administrador}">
                    <p:panelGrid styleClass="ui-noborder" columns="1">
                        <f:facet name="header">
                            Selecionar curso
                        </f:facet>
                        <p:autoComplete
                                value="#{rankingBean.curso}"
                                minQueryLength="2"
                                completeMethod="#{cursoBean.autoCompleteCurso}"
                                forceSelection="true"
                                var="c"
                                itemValue="#{c}"
                                itemLabel="#{c.nome}"
                                converter="cursoConverter">

                            <p:column headerText="Nome">
                                <h:outputText value="#{c.nome}"/>
                            </p:column>

                            <p:column headerText="Campus">
                                <h:outputText value="#{c.campus.nome}"/>
                            </p:column>
                        </p:autoComplete>

                        <f:facet name="footer">
                            <p:commandButton value="Atualizar"
                                             icon="fa fa-refresh"
                                             action="#{rankingBean.atualizarRankingCurso}"
                                             ajax="false"/>
                        </f:facet>
                    </p:panelGrid>
                </c:when>
                <c:otherwise>
                    <h1>Ranking - #{usuarioBean.usuarioLogado.curso.nome} - #{usuarioBean.usuarioLogado.curso.campus.nome}</h1>
                </c:otherwise>
            </c:choose>

            <br/>

            <p:dataTable value="#{rankingBean.rankingCurso}"
                         var="u"
                         emptyMessage="Nenhum palpiteiro encontrado para este curso."
                         rowIndexVar="idx"
                         rows="25"
                         paginatorAlwaysVisible="false"
                         paginator="true"
                         rowsPerPageTemplate="25, 50">
                <p:column headerText="Posição" width="9%">
                    <h:outputText value="#{idx + 1}"/>
                </p:column>

                <p:column headerText="Pontuação" width="9%">
                    <h:outputText value="#{u.pontuacao != null ? u.pontuacao : 0}"/>
                </p:column>

                <p:column headerText="Palpiteiro">
                    <h:outputText value="#{u.nome} #{u.sobrenome}"/>
                </p:column>
            </p:dataTable>
        </h:form>
    </ui:define>
</ui:composition>
