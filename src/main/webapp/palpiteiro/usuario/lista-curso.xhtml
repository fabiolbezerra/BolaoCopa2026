<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition
        template="/template.xhtml"
        xmlns="http://www.w3.org/1999/xhtml"
        xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
        xmlns:p="http://primefaces.org/ui"
        xmlns:h="http://java.sun.com/jsf/html"
        xmlns:f="http://java.sun.com/jsf/core">

    <ui:define name="title">Ranking por Curso</ui:define>

    <ui:define name="content">
        <h1>Ranking - #{usuarioBean.usuarioLogado.curso.nome}</h1>
        <br/>
        <h:form>
            <p:dataTable value="#{rankingBean.rankingCurso}"
                         var="u"
                         emptyMessage="Nenhum palpiteiro encontrado para este curso."
                         rowIndexVar="idx">
                <p:column headerText="Posição">
                    <h:outputText value="#{idx + 1}"/>
                </p:column>
                <p:column headerText="Palpiteiro">
                    <h:outputText value="#{u.nome} #{u.sobrenome}"/>
                </p:column>
                <p:column headerText="Pontuação">
                    <h:outputText value="#{u.pontuacao != null ? u.pontuacao : 0}"/>
                </p:column>
            </p:dataTable>
        </h:form>
    </ui:define>
</ui:composition>
