<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition
        template="/template.xhtml"
        xmlns="http://www.w3.org/1999/xhtml"
        xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
        xmlns:p="http://primefaces.org/ui"
        xmlns:h="http://java.sun.com/jsf/html"
        xmlns:f="http://java.sun.com/jsf/core">

    <ui:define name="title">Ranking Geral</ui:define>

    <ui:define name="content">
        <h1>Ranking Geral</h1>

        <br/>

        <h:form>
            <p:dataTable value="#{rankingBean.rankingGeral}"
                         var="u"
                         emptyMessage="Nenhum palpiteiro encontrado."
                         rows="25"
                         paginatorAlwaysVisible="false"
                         paginator="true"
                         rowsPerPageTemplate="25, 50">

                <p:column headerText="Posição" width="10%">
                    <h:outputText value="#{u.posicao}"/>
                </p:column>

                <p:column headerText="Pontuação" width="10%">
                    <h:outputText value="#{u.pontuacao}"/>
                </p:column>

                <p:column headerText="Palpiteiro">
                    <h:outputText value="#{u.nome} #{u.sobrenome}"/>
                </p:column>

                <p:column headerText="Campus">
                    <h:outputText value="#{u.campus.nome}"/>
                </p:column>

                <p:column headerText="Curso">
                    <h:outputText value="#{u.curso.nome}"/>
                </p:column>
            </p:dataTable>
        </h:form>
    </ui:define>
</ui:composition>
