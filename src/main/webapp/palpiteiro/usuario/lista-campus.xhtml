<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition
        template="/template.xhtml"
        xmlns="http://www.w3.org/1999/xhtml"
        xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
        xmlns:p="http://primefaces.org/ui"
        xmlns:h="http://java.sun.com/jsf/html"
        xmlns:f="http://java.sun.com/jsf/core"
        xmlns:c="http://java.sun.com/jsp/jstl/core">

    <ui:define name="title">Ranking por Campus</ui:define>

    <ui:define name="content">
        <h:form>
            <!-- Referência: https://www.baeldung.com/jstl -->
            <c:choose>
                <c:when test="#{usuarioBean.administrador}">
                    <p:panel header="Selecionar campus">
                        <p:autoComplete
                                value="#{rankingBean.campus}"
                                minQueryLength="2"
                                completeMethod="#{campusBean.autoCompleteCampus}"
                                forceSelection="true"
                                var="c"
                                itemValue="#{c}"
                                itemLabel="#{c.nome}"
                                converter="campusConverter"/>

                        <f:facet name="footer">
                            <p:commandButton value="Atualizar"
                                             action="#{rankingBean.atualizarRankingCampus()}"
                                             ajax="false"/>
                        </f:facet>
                    </p:panel>
                </c:when>
                <c:otherwise>
                    <h1>Ranking - #{usuarioBean.usuarioLogado.campus.nome}</h1>
                </c:otherwise>
            </c:choose>

            <br/>

            <p:dataTable value="#{rankingBean.rankingCampus}"
                         var="u"
                         emptyMessage="Nenhum palpiteiro encontrado para este campus."
                         rowIndexVar="idx"
                         rows="25"
                         paginatorAlwaysVisible="false"
                         paginator="true"
                         rowsPerPageTemplate="25, 50">
                <p:column headerText="Posição" width="10%">
                    <h:outputText value="#{idx + 1}"/>
                </p:column>

                <p:column headerText="Pontuação" width="10%">
                    <h:outputText value="#{u.pontuacao}"/>
                </p:column>

                <p:column headerText="Palpiteiro">
                    <h:outputText value="#{u.nome} #{u.sobrenome}"/>
                </p:column>

                <p:column headerText="Curso">
                    <h:outputText value="#{u.curso.nome}"/>
                </p:column>
            </p:dataTable>
        </h:form>
    </ui:define>
</ui:composition>
