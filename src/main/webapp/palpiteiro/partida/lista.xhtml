<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition
        template="/template.xhtml"
        xmlns="http://www.w3.org/1999/xhtml"
        xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
        xmlns:p="http://primefaces.org/ui"
        xmlns:h="http://java.sun.com/jsf/html"
        xmlns:f="http://java.sun.com/jsf/core">

    <ui:define name="title">
        Partidas da Copa
    </ui:define>

    <ui:define name="content">
        <h1>Calendário de Partidas</h1>

        <h:form>
            <p:tabView>

                <p:tab title="Próximas">
                    <p:dataTable value="#{partidaBean.proximasPartidas}" var="p"
                                 emptyMessage="Nenhuma partida">

                        <p:column headerText="Fase" width="15%">
                            <h:outputText value="#{p.fase.nome}"/>
                        </p:column>

                        <p:column headerText="Data e Hora" sortBy="#{p.inicioDaPartida}" width="15%">
                            <h:outputText value="#{p.inicioDaPartida}">
                                <f:convertDateTime pattern="dd/MM/yyyy HH:mm" timeZone="GMT-3"/>
                            </h:outputText>
                        </p:column>

                        <p:column headerText="Placar">
                            <p:outputPanel style="display: flex; justify-content: center; align-items: center;">
                                <h:outputText value="#{p.selecaoA.nome} (#{p.selecaoA.sigla}) "/>
                                <p:graphicImage value="/resources/imagens/#{p.selecaoA.simbolo}" width="24px"/>
                                <h:outputText value="#{p.golsA}"/> <p:spacer width="10px"/>
                                X
                                <p:spacer width="10px"/><h:outputText value="#{p.golsB} "/>
                                <p:graphicImage value="/resources/imagens/#{p.selecaoB.simbolo}" width="24px"/>
                                <h:outputText value=" #{p.selecaoB.nome} (#{p.selecaoB.sigla})"/>
                            </p:outputPanel>
                        </p:column>

                        <p:column headerText="Local" width="15%" sortBy="#{p.local}">
                            <h:outputText value="#{p.local}"/>
                        </p:column>

                        <p:column headerText="Operações" width="15%">
                            <p:button value="Palpitar"
                                      rendered="#{usuarioBean.palpiteiro}"
                                      disabled="#{partidaBean.isExpirada(p)}"
                                      outcome="/palpiteiro/palpite/formulario.xhtml">
                                <f:param name="partidaID" value="#{p.id}"/>
                            </p:button>

                            <p:outputPanel rendered="#{usuarioBean.administrador}">
                                <p:splitButton value="Editar"
                                               action="/administrador/partida/formulario.xhtml?faces-redirect=true">
                                    <f:param name="partidaID" value="#{p.id}"/>

                                    <p:menuitem value="Excluir"
                                                title="Excluir a partida, quando não há palpites na mesma"
                                                action="#{partidaBean.excluir()}"
                                                update="@form">
                                        <f:setPropertyActionListener value="p" target="#{partidaBean.partida}"/>
                                    </p:menuitem>

                                    <p:menuitem value="Publicar"
                                                title="Exibir ou ocultar as partidas dos palpiteiros"
                                                action="#{partidaBean.publicar()}"
                                                update="@form">
                                        <f:setPropertyActionListener value="p" target="#{partidaBean.partida}"/>
                                    </p:menuitem>
                                </p:splitButton>
                            </p:outputPanel>
                        </p:column>
                    </p:dataTable>
                </p:tab>

                <p:tab title="Anteriores">
                    <p:dataTable value="#{partidaBean.partidasAnteriores}" var="p"
                                 emptyMessage="Nenhuma partida">

                        <p:column headerText="Fase">
                            <h:outputText value="#{p.fase.nome}"/>
                        </p:column>

                        <p:column headerText="Data e Hora" sortBy="#{p.inicioDaPartida}">
                            <h:outputText value="#{p.inicioDaPartida}">
                                <f:convertDateTime pattern="dd/MM/yyyy HH:mm"/>
                            </h:outputText>
                        </p:column>

                        <p:column headerText="Seleção A">
                            <h:outputText value="#{p.selecaoA.nome} (#{p.selecaoA.sigla})"/>
                        </p:column>

                        <p:column headerText="Placar">
                            <div align="center">
                                <h:outputText value="#{p.golsA}"/> X <h:outputText value="#{p.golsB}"/>
                            </div>
                        </p:column>

                        <p:column headerText="Seleção B">
                            <h:outputText value="#{p.selecaoB.nome} (#{p.selecaoB.sigla})"/>
                        </p:column>

                        <p:column headerText="Local">
                            <h:outputText value="#{p.local}"/>
                        </p:column>

                        <p:column headerText="Operações" width="15%" rendered="#{usuarioBean.administrador}">

                            <p:splitButton value="Placar"
                                           action="/administrador/partida/formulario-placar.xhtml?faces-redirect=true">
                                <f:param name="partidaID" value="#{p.id}"/>

                                <p:menuitem value="Processar"
                                            title="Calcular pontuações dos palpites e classificar os palpiteiros"
                                            action="#{partidaBean.processar()}"
                                            update="@form">
                                    <f:setPropertyActionListener value="p" target="#{partidaBean.partida}"/>
                                </p:menuitem>
                            </p:splitButton>
                        </p:column>

                    </p:dataTable>
                </p:tab>

            </p:tabView>
        </h:form>

    </ui:define>
</ui:composition>
