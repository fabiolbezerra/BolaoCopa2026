<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition
        template="/template.xhtml"
        xmlns="http://www.w3.org/1999/xhtml"
        xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
        xmlns:p="http://primefaces.org/ui"
        xmlns:h="http://java.sun.com/jsf/html"
        xmlns:f="http://java.sun.com/jsf/core">

    <ui:define name="title">
        Partidas da Copa
    </ui:define>

    <ui:define name="content">
        <h1>Calendário de Partidas</h1>

        <br/>

        <p:button value="Adicionar Partida"
                  icon="fa fa-plus"
                  rendered="#{usuarioBean.administrador}"
                  outcome="/administrador/partida/formulario.xhtml"/>

        <br/>
        <br/>

        <h:form>
            <p:growl showSummary="true" showDetail="true"/>

            <p:tabView>

                <p:tab title="Próximas">
                    <p:dataTable value="#{partidaBean.proximasPartidas}"
                                 var="p"
                                 emptyMessage="Nenhuma partida"
                                 rows="10"
                                 paginatorAlwaysVisible="false"
                                 paginator="true"
                                 rowsPerPageTemplate="10, 20"
                                 reflow="true">

                        <p:column headerText="Fase" width="10%">
                            <h:outputText value="#{p.fase.nome}"/>
                        </p:column>

                        <p:column headerText="Data e Hora" sortBy="#{p.inicioDaPartida}" width="10%">
                            <h:outputText value="#{p.inicioDaPartida}">
                                <f:convertDateTime pattern="dd/MM/yyyy HH:mm" timeZone="GMT-3"/>
                            </h:outputText>
                        </p:column>

                        <p:column headerText="Local" width="14%" sortBy="#{p.local}">
                            <h:outputText value="#{p.local}"/>
                        </p:column>

                        <p:column headerText="Partida ">
                            <p:outputPanel style="display: flex; justify-content: center; align-items: center;">
                                <h:outputText value="#{p.selecaoA.nome} (#{p.selecaoA.sigla}) "/> <p:spacer
                                    width="10px"/>
                                <p:graphicImage value="/resources/imagens/#{p.selecaoA.simbolo}" width="24px"/>
                                <p:spacer width="10px"/>
                                x
                                <p:spacer width="10px"/>
                                <p:graphicImage value="/resources/imagens/#{p.selecaoB.simbolo}" width="24px"/>
                                <p:spacer width="10px"/> <h:outputText
                                    value=" #{p.selecaoB.nome} (#{p.selecaoB.sigla})"/>
                            </p:outputPanel>
                        </p:column>

                        <p:column headerText="Publicada" width="10%" rendered="#{usuarioBean.administrador}">
                            <h:outputText value="#{p.publicada ? 'Sim' : 'Não'}"/>
                        </p:column>

                        <p:column headerText="Operações" width="10%">
                            <p:button value="Palpitar"
                                      icon="fa fa-futbol-o"
                                      rendered="#{usuarioBean.palpiteiro}"
                                      disabled="#{partidaBean.isExpirada(p)}"
                                      outcome="/palpiteiro/palpite/formulario.xhtml">
                                <f:param name="partidaID" value="#{p.id}"/>
                            </p:button>

                            <p:outputPanel rendered="#{usuarioBean.administrador}">
                                <p:splitButton value="Editar"
                                               icon="fa fa-pencil-square-o"
                                               action="/administrador/partida/formulario.xhtml">
                                    <f:param name="partidaID" value="#{p.id}"/>

                                    <p:menuitem value="Excluir"
                                                icon="fa fa-trash-o"
                                                title="Excluir a partida, quando não há palpites na mesma"
                                                action="#{partidaBean.excluir()}"
                                                update="@form">
                                        <f:setPropertyActionListener value="#{p}" target="#{partidaBean.partida}"/>

                                        <p:confirm header="Confirmação"
                                                   message="Deseja realmente excluir essa partida?"
                                                   icon="pi pi-exclamation-triangle"/>
                                    </p:menuitem>

                                    <p:menuitem value="Palpites"
                                                icon="fa fa-table"
                                                title="Exibir os palpites da partida"
                                                outcome="/administrador/palpite/lista-partida.xhtml">
                                        <f:param name="partidaID" value="#{p.id}"/>
                                    </p:menuitem>

                                    <p:menuitem value="Publicar"
                                                icon="fa fa-eye"
                                                title="Exibir ou ocultar as partidas dos palpiteiros"
                                                action="#{partidaBean.publicar()}"
                                                update="@form">
                                        <f:setPropertyActionListener value="#{p}" target="#{partidaBean.partida}"/>
                                    </p:menuitem>
                                </p:splitButton>
                            </p:outputPanel>
                        </p:column>
                    </p:dataTable>
                </p:tab>

                <p:tab title="Anteriores">
                    <p:dataTable value="#{partidaBean.partidasAnteriores}"
                                 var="p"
                                 emptyMessage="Nenhuma partida"
                                 rows="10"
                                 paginatorAlwaysVisible="false"
                                 paginator="true"
                                 rowsPerPageTemplate="10, 20"
                                 reflow="true">

                        <p:column headerText="Fase">
                            <h:outputText value="#{p.fase.nome}"/>
                        </p:column>

                        <p:column headerText="Data e Hora" sortBy="#{p.inicioDaPartida}">
                            <h:outputText value="#{p.inicioDaPartida}">
                                <f:convertDateTime pattern="dd/MM/yyyy HH:mm" timeZone="GMT-3"/>
                            </h:outputText>
                        </p:column>

                        <p:column headerText="Local">
                            <h:outputText value="#{p.local}"/>
                        </p:column>

                        <p:column headerText="Partida / Placar" width="40%">
                            <p:outputPanel style="display: flex; justify-content: center; align-items: center;">
                                <h:outputText value="#{p.selecaoA.nome} (#{p.selecaoA.sigla}) "/> <p:spacer
                                    width="10px"/>
                                <p:graphicImage value="/resources/imagens/#{p.selecaoA.simbolo}" width="24px"/>
                                <p:spacer width="10px"/><h:outputText value="[ #{p.golsA}"/> <p:spacer width="10px"/>
                                x
                                <p:spacer width="10px"/> <h:outputText value="#{p.golsB} ]"/><p:spacer width="10px"/>
                                <p:graphicImage value="/resources/imagens/#{p.selecaoB.simbolo}" width="24px"/>
                                <p:spacer width="10px"/> <h:outputText
                                    value=" #{p.selecaoB.nome} (#{p.selecaoB.sigla})"/>
                            </p:outputPanel>
                        </p:column>

                        <p:column headerText="Operações" width="10%" rendered="#{usuarioBean.administrador}">

                            <p:splitButton value="Placar"
                                           icon="fa fa-futbol-o"
                                           action="/administrador/partida/formulario-placar.xhtml">
                                <f:param name="partidaID" value="#{p.id}"/>

                                <p:menuitem value="Palpites"
                                            icon="fa fa-table"
                                            title="Exibir os palpites da partida"
                                            outcome="/administrador/palpite/lista-partida.xhtml">
                                    <f:param name="partidaID" value="#{p.id}"/>
                                </p:menuitem>

                                <p:menuitem value="Processar"
                                            icon="fa fa-cogs"
                                            title="Calcular pontuações dos palpites e classificar os palpiteiros"
                                            action="#{partidaBean.processar()}"
                                            update="@form">
                                    <f:setPropertyActionListener value="#{p}" target="#{partidaBean.partida}"/>

                                    <p:confirm header="Confirmação"
                                               message="Deseja realmente processar essa partida?"
                                               icon="pi pi-exclamation-triangle"/>
                                </p:menuitem>
                            </p:splitButton>
                        </p:column>

                    </p:dataTable>
                </p:tab>

            </p:tabView>

            <p:confirmDialog global="true"
                             showEffect="fade"
                             hideEffect="fade">

                <p:commandButton value="Sim"
                                 type="button"
                                 styleClass="ui-confirmdialog-yes"
                                 icon="fa fa-check"/>

                <p:commandButton value="Não"
                                 type="button"
                                 styleClass="ui-confirmdialog-no"
                                 icon="fa fa-ban"/>

            </p:confirmDialog>
        </h:form>

    </ui:define>
</ui:composition>
