<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition
        template="/template.xhtml"
        xmlns="http://www.w3.org/1999/xhtml"
        xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
        xmlns:p="http://primefaces.org/ui"
        xmlns:h="http://java.sun.com/jsf/html"
        xmlns:f="http://java.sun.com/jsf/core">

    <ui:define name="title">
        Palpite
    </ui:define>

    <ui:define name="content">
        <h1>Palpite</h1>

        <h:form id="formPalpite">
            <!-- DADOS DA PARTIDA -->
            <p:panel header="Dados da Partida">
                <h:panelGrid columns="2" columnClasses="label-col, value-col"
                             style="width: 100%">

                    <h:outputText value="Fase:"/>
                    <h:outputText
                            value="#{palpiteBean.partida.fase != null ? palpiteBean.partida.fase.nome : 'Não informada'}"/>

                    <h:outputText value="Data e Hora:"/>
                    <h:outputText value="#{palpiteBean.partida.inicioDaPartida}">
                        <f:convertDateTime pattern="dd/MM/yyyy HH:mm" timeZone="GMT-3"/>
                    </h:outputText>

                    <h:outputText value="Local:"/>
                    <h:outputText
                            value="#{palpiteBean.partida.local != null ? palpiteBean.partida.local : 'Sem local determinado'}"/>

                </h:panelGrid>
            </p:panel>

            <br/>

            <!-- PALPITE -->
            <p:panel header="Meu Palpite">
                <p:messages autoUpdate="true" showDetail="true" closable="true"/>

                <h:outputText value="Coloque o resultado de quanto você acha que vai ser o jogo"/>

                <h:panelGrid columns="3" style="width: 50%; margin: 0 auto; text-align: center;">
                    <f:facet name="header">Palpite no tempo normal</f:facet>

                    <h:outputText value="#{palpiteBean.partida.selecaoA.nome}"
                                  style="font-weight: bold; display: block;"/>
                    <h:outputText value=""/>
                    <h:outputText value="#{palpiteBean.partida.selecaoB.nome}"
                                  style="font-weight: bold; display: block;"/>

                    <p:graphicImage value="/resources/imagens/#{palpiteBean.partida.selecaoA.simbolo}" width="32px"/>
                    <h:outputText value="x"
                                  style="font-weight: bold; font-size: 1.5em; display: block; text-align: center;"/>
                    <p:graphicImage value="/resources/imagens/#{palpiteBean.partida.selecaoB.simbolo}" width="32px"/>

                    <p:spinner value="#{palpiteBean.palpite.golsA}"
                               stepFactor="1"
                               min="0"
                               style="width: 60px; text-align: center;"
                               required="true"
                               requiredMessage="Informe os gols"/>
                    <h:outputText value=""/>
                    <p:spinner value="#{palpiteBean.palpite.golsB}"
                               stepFactor="1"
                               min="0"
                               style="width: 60px; text-align: center;"
                               required="true"
                               requiredMessage="Informe os gols"/>
                </h:panelGrid>

                <br/>

                <!-- CAMPO APENAS PARA FASE ELIMINATÓRIA -->
                <h:panelGrid columns="2" cellpadding="5" rendered="#{palpiteBean.partida.fase.eliminatoria}">
                    <f:facet name="header">Palpite para a fase eliminatória</f:facet>

                    <h:outputText value="Tipo de Vitória:"/>
                    <p:selectOneMenu value="#{palpiteBean.palpite.tipoDeVitoria}"
                                     required="true">
                        <p:ajax update="line"/>
                        <f:selectItem itemLabel="Selecione..." itemValue="#{null}"/>
                        <f:selectItems value="#{palpiteBean.tiposDeVitoria}"
                                       var="tipo"
                                       itemLabel="#{tipo.descricao}"
                                       itemValue="#{tipo}"/>
                    </p:selectOneMenu>

                    <h:outputText value="Seleção Vencedora nos pênaltis:"/>
                    <p:selectOneRadio id="line"
                                      value="#{palpiteBean.selecaoVencedoraId}"
                                      layout="lineDirection"
                                      disabled="#{palpiteBean.palpite.tipoDeVitoria == null || palpiteBean.palpite.tipoDeVitoria.tempoNormal || palpiteBean.palpite.tipoDeVitoria.prorrogacao}">
                        <f:selectItem itemLabel="#{palpiteBean.partida.selecaoA.nome}"
                                      itemValue="#{palpiteBean.partida.selecaoA.id}"/>
                        <f:selectItem itemLabel="#{palpiteBean.partida.selecaoB.nome}"
                                      itemValue="#{palpiteBean.partida.selecaoB.id}"/>
                    </p:selectOneRadio>
                </h:panelGrid>
            </p:panel>

            <br/>


            <!-- BOTÕES -->
            <p:commandButton value="Salvar"
                             icon="fa fa-floppy-o"
                             action="#{palpiteBean.salvar()}"
                             update="@form"/>
            <p:button value="Cancelar"
                      title="Retorna a lista de palpites"
                      icon="fa fa-ban"
                      outcome="/palpiteiro/palpite/lista.xhtml"/>

        </h:form>

    </ui:define>
</ui:composition>
