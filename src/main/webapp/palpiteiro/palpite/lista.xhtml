<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition
        template="/template.xhtml"
        xmlns="http://www.w3.org/1999/xhtml"
        xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
        xmlns:p="http://primefaces.org/ui"
        xmlns:h="http://java.sun.com/jsf/html"
        xmlns:f="http://java.sun.com/jsf/core">

    <ui:define name="title">
        Meus Palpites
    </ui:define>

    <ui:define name="content">
        <h1>Meus Palpites</h1>

        <h:form>
            <p:button value="Fazer Novo Palpite"
                      outcome="/palpiteiro/partida/lista.xhtml"
                      style="margin-bottom: 10px;"/>

            <p:dataTable value="#{palpiteBean.meusPalpites}" var="pal"
                         emptyMessage="Você ainda não fez nenhum palpite.">

                <p:column headerText="Jogo">
                    <p:outputPanel style="display: flex; align-items: center; gap: 8px;">
                        <p:graphicImage value="/resources/imagens/#{pal.partida.selecaoA.simbolo}" width="24px"/>
                        <h:outputText value="#{pal.partida.selecaoA.nome}"/>
                        <h:outputText value=" x "/>
                        <h:outputText value="#{pal.partida.selecaoB.nome}"/>
                        <p:graphicImage value="/resources/imagens/#{pal.partida.selecaoB.simbolo}" width="24px"/>
                    </p:outputPanel>
                </p:column>

                <p:column headerText="Data da Partida">
                    <h:outputText value="#{pal.partida.inicioDaPartida}">
                        <f:convertDateTime pattern="dd/MM/yyyy HH:mm" timeZone="GMT-3"/>
                    </h:outputText>
                </p:column>

                <p:column headerText="Meu Palpite">
                    <h:outputText value="#{pal.golsA} x #{pal.golsB}"/>
                </p:column>

                <p:column headerText="Data do Palpite">
                    <h:outputText value="#{pal.dataDoPalpite}">
                        <f:convertDateTime pattern="dd/MM/yyyy HH:mm" timeZone="GMT-3"/>
                    </h:outputText>
                </p:column>

                <p:column headerText="Operações">
                    <p:button value="Editar"
                              outcome="/palpiteiro/palpite/formulario.xhtml"
                              disabled="#{partidaBean.isExpirada(pal.partida)}">
                        <f:param name="partidaID" value="#{pal.partida.id}"/>
                    </p:button>
                    <h:outputText value=" "/>
                    <p:commandButton value="Excluir"
                                     action="#{palpiteBean.excluir()}"
                                     disabled="#{partidaBean.isExpirada(pal.partida)}"
                                     update="@form">
                        <f:setPropertyActionListener value="#{pal}" target="#{palpiteBean.palpite}"/>
                    </p:commandButton>
                </p:column>

            </p:dataTable>
        </h:form>

    </ui:define>
</ui:composition>
