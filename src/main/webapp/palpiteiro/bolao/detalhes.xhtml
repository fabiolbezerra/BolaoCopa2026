<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition
        template="/template.xhtml"
        xmlns="http://www.w3.org/1999/xhtml"
        xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
        xmlns:p="http://primefaces.org/ui"
        xmlns:h="http://java.sun.com/jsf/html">
    <ui:define name="title">
        Detalhes do Bolão
    </ui:define>

    <ui:define name="content">
        <h1>Bolão #{bolaoBean.bolao.nome}</h1>

        <h2>Detalhes</h2>
        <ul>
            <li>Dono: #{bolaoBean.bolao.dono.nome} #{bolaoBean.bolao.dono.sobrenome}</li>
            <li>Criação: <h:outputText value="#{bolaoBean.bolao.criacao}">
                <f:convertDateTime pattern="dd/MM/yyyy" xmlns:f="http://java.sun.com/jsf/core"/>
            </h:outputText></li>
        </ul>

        <h2>Membros</h2>

        <p:dataTable value="#{bolaoBean.participantes}"
                     var="participante"
                     sortOrder="descending"
                     rowIndexVar="i">
            <p:column headerText="Posição">
                #{i+1}
            </p:column>

            <p:column headerText="Nome" width="25%">
                #{participante.usuario.nome} #{participante.usuario.sobrenome}
            </p:column>

            <p:column headerText="Pontuação">
                #{participante.usuario.pontuacao}
            </p:column>

            <p:column headerText="Posição Geral">
                #{participante.usuario.posicao}
            </p:column>

            <p:column headerText="Campus / Curso">
                <h:outputText value="#{participante.usuario.campus.nome}"/>
                <h:outputText value=" / #{participante.usuario.curso.nome}" rendered="#{not empty participante.usuario.curso}"/>
            </p:column>

        </p:dataTable>

    </ui:define>
</ui:composition>
