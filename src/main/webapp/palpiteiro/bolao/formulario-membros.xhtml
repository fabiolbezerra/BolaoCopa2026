<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">

<ui:composition
        template="/template.xhtml"
        xmlns="http://www.w3.org/1999/xhtml"
        xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
        xmlns:p="http://primefaces.org/ui"
        xmlns:h="http://java.sun.com/jsf/html"
        xmlns:f="http://java.sun.com/jsf/core">

    <ui:define name="title">
        Cadastro do Bolão
    </ui:define>

    <ui:define name="content">

        <h1>Bolão #{membroDoBolaoBean.bolao.nome}</h1>

        <br/>

        <h2>Detalhes do bolão</h2>

        <ul>

            <li>Dono:</li>

            <ul>

                <li>

                    <h:outputText
                            value="#{membroDoBolaoBean.bolao.dono.nome} #{membroDoBolaoBean.bolao.dono.sobrenome}"/>

                </li>

                <li>

                    Curso:
                    <h:outputText
                            value="#{membroDoBolaoBean.bolao.dono.curso.nome}"/>

                </li>

                <li>

                    Campus:
                    <h:outputText
                            value="#{membroDoBolaoBean.bolao.dono.campus.nome}"/>

                </li>

            </ul>

            <li>
                Criação:
                <h:outputText value="#{membroDoBolaoBean.bolao.criacao}">

                    <f:convertDateTime pattern="dd/MM/yyyy HH:mm"/>

                </h:outputText>
            </li>

        </ul>

        <h1>Membros do bolão</h1>

        <br/>

        <h:form>

            <p:growl showDetail="true"
                     showSummary="true"/>

            <p:confirmDialog global="true"
                             showEffect="fade"
                             hideEffect="fade">

                <p:commandButton value="Sim"
                                 type="button"
                                 styleClass="ui-confirmdialog-yes"
                                 icon="fa fa-check"/>

                <p:commandButton value="Não"
                                 type="button"
                                 styleClass="ui-confirmdialog-no"
                                 icon="fa fa-ban"/>

            </p:confirmDialog>

            <div class="ui-g">

                <div class="ui-g-4">

                    <p:panelGrid styleClass="ui-noborder"
                                 columns="2">

                        <p:outputLabel value="Membro"/>

                        <p:autoComplete
                                value="#{membroDoBolaoBean.participante.usuario}"
                                minQueryLength="3"
                                completeMethod="#{usuarioBean.autoCompletePalpiteiros}"
                                var="palpiteiro"
                                itemValue="#{palpiteiro}"
                                itemLabel="#{palpiteiro.nome}"
                                converter="usuarioConverter">

                            <p:column headerText="Nome">
                                <h:outputText value="#{palpiteiro.nome} #{palpiteiro.sobrenome}"/>
                            </p:column>

                            <p:column headerText="Campus">
                                <h:outputText value="#{palpiteiro.campus.nome}"/>
                            </p:column>

                            <p:column headerText="Curso">
                                <h:outputText value="#{palpiteiro.curso.nome}"/>
                            </p:column>
                        </p:autoComplete>

                        <f:facet name="footer">

                            <p:commandButton value="Adicionar"
                                             title="Adiciona o palpiteiro selecionado no bolão."
                                             icon="fa fa-user-plus"
                                             action="#{membroDoBolaoBean.adicionarParticipante()}"
                                             update="@form"/>

                        </f:facet>

                    </p:panelGrid>

                </div>

                <div class="ui-g-8">

                    <p:dataTable value="#{membroDoBolaoBean.participantes}"
                                 var="membro">

                        <p:column headerText="Nome">
                            <h:outputText value="#{membro.usuario.nome} #{membro.usuario.sobrenome}"/>
                        </p:column>

                        <p:column headerText="Campus / Curso">
                            <h:outputText value="#{membro.usuario.campus.nome}"/>

                            <h:outputText value="/ #{membro.usuario.curso.nome}"
                                          rendered="#{not empty membro.usuario.curso}"/>
                        </p:column>

                        <p:column
                                headerText="Operações"
                                width="10%">

                            <p:commandButton
                                    value="Excluir"
                                    icon="fa fa-trash-o"
                                    rendered="#{!(membroDoBolaoBean.bolao.dono eq membro.usuario)}"
                                    action="#{membroDoBolaoBean.removerParticipante()}"
                                    update="@form">

                                <f:setPropertyActionListener
                                        value="#{membro}"
                                        target="#{membroDoBolaoBean.participante}"/>

                                <p:confirm header="Confirmação"
                                           message="Deseja realmente remover este participante?"
                                           icon="pi pi-exclamation-triangle"/>

                            </p:commandButton>
                        </p:column>
                    </p:dataTable>
                </div>
            </div>
        </h:form>
    </ui:define>
</ui:composition>
