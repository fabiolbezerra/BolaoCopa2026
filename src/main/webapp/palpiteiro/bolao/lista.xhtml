<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition
        template="/template.xhtml"
        xmlns="http://www.w3.org/1999/xhtml"
        xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
        xmlns:p="http://primefaces.org/ui"
        xmlns:h="http://java.sun.com/jsf/html"
        xmlns:c="http://java.sun.com/jsp/jstl/core"
        xmlns:f="http://java.sun.com/jsf/core">
    <ui:define name="title">
        Meus Bolões
    </ui:define>

    <ui:define name="content">
        <h1>
            <!-- Referência: https://www.baeldung.com/jstl -->
            <c:choose>
                <c:when test="#{usuarioBean.administrador}">
                    Todos os Bolões
                </c:when>
                <c:otherwise>
                    Meus Bolões
                </c:otherwise>
            </c:choose>
        </h1>

        <br/>

        <h:form>

            <p:commandButton value="Criar Novo Bolão"
                             rendered="#{usuarioBean.palpiteiro}"
                             action="formulario.xhtml"
                             icon="fa fa-plus"/>

        </h:form>

        <h:form>
            <p:growl showSummary="true" showDetail="true"/>

            <p:dataTable value="#{bolaoBean.boloes}"
                         var="bolao"
                         emptyMessage="Nenhum bolão cadastrado"
                         reflow="true">
                <p:column headerText="Nome">
                    <h:outputText value="#{bolao.nome}"/>
                </p:column>

                <p:column headerText="Data de Criação">
                    <h:outputText value="#{bolao.criacao}">
                        <f:convertDateTime pattern="dd/MM/yyyy"/>
                    </h:outputText>
                </p:column>

                <p:column headerText="Dono">
                    <h:outputText value="#{bolao.dono.nome} #{bolao.dono.sobrenome}"/>
                </p:column>

                <p:column headerText="Operações">
                    <p:commandButton value="Editar"
                                     icon="fa fa-pencil-square-o"
                                     rendered="#{bolao.dono eq usuarioBean.usuarioLogado}"
                                     action="formulario.xhtml">
                        <f:setPropertyActionListener value="#{bolao}" target="#{bolaoBean.bolao}"/>
                    </p:commandButton>

                    <p:commandButton value="Membros"
                                     icon="fa fa-users"
                                     rendered="#{bolao.dono eq usuarioBean.usuarioLogado}"
                                     action="formulario-membros.xhtml">
                        <f:param name="bolaoID" value="#{bolao.id}"/>
                    </p:commandButton>

                    <p:commandButton value="Excluir"
                                     icon="fa fa-trash-o"
                                     rendered="#{bolao.dono eq usuarioBean.usuarioLogado}"
                                     action="#{bolaoBean.excluir()}"
                                     update="@form">
                        <f:setPropertyActionListener value="#{bolao}" target="#{bolaoBean.bolao}"/>

                        <p:confirm header="Confirmação"
                                   message="Deseja excluir o bolão?"
                                   icon="fa fa-exclamation"/>
                    </p:commandButton>

                    <p:commandButton value="Sair"
                                     title="Sair ou deixar de ser membro do bolão."
                                     rendered="#{bolaoBean.isApenasParticipante(bolao)}"
                                     action="#{bolaoBean.sair()}"
                                     update="@form"
                                     icon="fa fa-sign-out">
                        <f:setPropertyActionListener value="#{bolao}" target="#{bolaoBean.bolao}"/>
                    </p:commandButton>

                    <p:commandButton value="Detalhes"
                                     icon="fa fa-info-circle"
                                     action="detalhes.xhtml">
                        <f:param value="#{bolao.id}" name="bolaoID"/>
                    </p:commandButton>
                </p:column>
            </p:dataTable>

            <p:confirmDialog global="true" showEffect="fade" hideEffect="fade" responsive="true" width="350">
                <p:commandButton value="Não" type="button"
                                 styleClass="ui-confirmdialog-no ui-button-flat"
                                 icon="fa fa-ban"/>
                <p:commandButton value="Sim" type="button"
                                 styleClass="ui-confirmdialog-yes"
                                 icon="fa fa-check"/>
            </p:confirmDialog>
        </h:form>
    </ui:define>
</ui:composition>
