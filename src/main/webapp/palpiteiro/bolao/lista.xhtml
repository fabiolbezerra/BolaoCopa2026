<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition
        template="/template.xhtml"
        xmlns="http://www.w3.org/1999/xhtml"
        xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
        xmlns:p="http://primefaces.org/ui"
        xmlns:h="http://java.sun.com/jsf/html"
        xmlns:c="http://java.sun.com/jsp/jstl/core"
        xmlns:f="http://java.sun.com/jsf/core">
    <ui:define name="title">
        Meus Bolões
    </ui:define>

    <ui:define name="content">
        <h1>
            <!-- Referência: https://www.baeldung.com/jstl -->
            <c:choose>
                <c:when test="#{usuarioBean.administrador}">
                    Todos os Bolões
                </c:when>
                <c:otherwise>
                    Meus Bolões
                </c:otherwise>
            </c:choose>
        </h1>

        <br/>

        <h:form>
            <p:dataTable value="#{bolaoBean.boloes}" var="bolao">
                <p:column headerText="Nome">
                    <h:outputText value="#{bolao.nome}"/>
                </p:column>

                <p:column headerText="Data de Criação">
                    <h:outputText value="#{bolao.criacao}">
                        <f:convertDateTime pattern="dd/MM/yyyy"/>
                    </h:outputText>
                </p:column>

                <p:column headerText="Dono">
                    <h:outputText value="#{bolao.dono.nome} #{bolao.dono.sobrenome}"/>
                </p:column>

                <p:column headerText="Operações">
                    <p:commandButton value="Editar"
                                     rendered="#{bolao.dono eq usuarioBean.usuarioLogado}"
                                     action="formulario.xhtml">
                        <f:setPropertyActionListener value="#{bolao}" target="#{bolaoBean.bolao}"/>
                    </p:commandButton>

                    <p:commandButton value="Membros"
                                     rendered="#{bolao.dono eq usuarioBean.usuarioLogado}"
                                     action="formulario-membros.xhtml"
                                     ajax="false">
                        <f:param name="bolaoID" value="#{bolao.id}"/>
                    </p:commandButton>

                    <p:commandButton value="Excluir"
                                     rendered="#{bolao.dono eq usuarioBean.usuarioLogado}"
                                     action="#{bolaoBean.excluir()}">
                        <f:setPropertyActionListener value="#{bolao}" target="#{bolaoBean.bolao}"/>
                    </p:commandButton>

                    <p:commandButton value="Sair se apenas participante"
                                     rendered="#{bolaoBean.isApenasParticipante(bolao)}"
                                     action="#{bolaoBean.sair()}">
                        <f:setPropertyActionListener value="#{bolao}" target="#{bolaoBean.bolao}"/>
                    </p:commandButton>
                    |
                    <p:commandButton value="Detalhes"
                                     action="detalhes.xhtml">
                        <f:setPropertyActionListener value="#{bolao}" target="#{bolaoBean.bolao}"/>
                    </p:commandButton>
                </p:column>
            </p:dataTable>
        </h:form>
    </ui:define>
</ui:composition>
