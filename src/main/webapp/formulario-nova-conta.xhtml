<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition
        template="/template.xhtml"
        xmlns="http://www.w3.org/1999/xhtml"
        xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
        xmlns:p="http://primefaces.org/ui"
        xmlns:h="http://java.sun.com/jsf/html"
        xmlns:f="http://java.sun.com/jsf/core">
    <ui:define name="title">
        Nova Conta
    </ui:define>

    <ui:define name="top">
        <h:outputText value="Bolão da Copa do Mundo 2026" style="font-size: x-large"/>
        <br/>
        Entretendo Palpiteiros da UFRA na Copa do Mundo de 2026
    </ui:define>

    <ui:define name="content">
        <h1>Criar Conta</h1>

        <br/>

        <h:form>
            <p:growl showSummary="true" showDetail="true" />

            <p:panelGrid styleClass="ui-noborder" columns="2" rendered="#{novaContaBean.panelEmail}">
                <p:outputLabel value="E-mail"/>
                <p:inputText value="#{novaContaBean.email}" />

                <f:facet name="footer">
                    <p:commandButton value="Criar" action="#{novaContaBean.enviarEmail()}" ajax="false" />
                </f:facet>
            </p:panelGrid>

            <p:panelGrid styleClass="ui-noborder" columns="2" rendered="#{novaContaBean.panelCodigo}">
                <p:outputLabel value="Código"/>
                <p:inputText value="#{novaContaBean.codigoInformado}" />

                <f:facet name="footer">
                    <p:commandButton value="Validar" action="#{novaContaBean.validarEmail()}" ajax="false" />
                </f:facet>
            </p:panelGrid>

            <p:panelGrid styleClass="ui-noborder" columns="2" rendered="#{novaContaBean.panelFormulario}">
                <p:outputLabel value="Nome"/>
                <p:inputText value="#{novaContaBean.usuario.nome}" />

                <p:outputLabel value="Sobrenome"/>
                <p:inputText value="#{novaContaBean.usuario.sobrenome}" />

                <p:outputLabel value="Tipo"/>
                <p:selectOneMenu value="#{novaContaBean.usuario.tipo}">
                    <f:selectItem itemLabel="Selecione..." itemValue="" noSelectionOption="true" />

                    <f:selectItem itemLabel="Discente (Aluno)" itemValue="DISCENTE" />
                    <f:selectItem itemLabel="Docente (Professor)" itemValue="DOCENTE" />
                    <f:selectItem itemLabel="Técnico (Funcionário)" itemValue="TECNICO" />

                    <p:ajax update="menuCurso" />
                </p:selectOneMenu>

                <p:outputLabel value="Curso"/>
                <p:selectOneMenu id="menuCurso" value="#{novaContaBean.usuario.curso}" converter="cursoConverter"
                                 disabled="#{novaContaBean.usuario.tipo eq 'TECNICO'
                                 or novaContaBean.usuario.tipo eq 'DOCENTE'}">
                    <f:selectItem itemLabel="Selecione..." itemValue="" noSelectionOption="true" />
                    <f:selectItems value="#{cursoBean.cursos}" var="c" itemLabel="#{c.nome}" itemValue="#{c}" />
                </p:selectOneMenu>

                <p:outputLabel value="Campus"/>
                <p:selectOneMenu value="#{novaContaBean.usuario.campus}"  converter="campusConverter">
                    <f:selectItem itemLabel="Selecione..." itemValue="" noSelectionOption="true" />
                    <f:selectItems value="#{campusBean.campi}" var="c" itemLabel="#{c.nome}" itemValue="#{c}" />
                </p:selectOneMenu>

                <p:outputLabel value="Senha"/>
                <p:password value="#{novaContaBean.usuario.senha}" />


                <f:facet name="footer">
                    <p:commandButton value="Salvar Usuário" action="#{novaContaBean.criarConta()}" ajax="false" />
                </f:facet>
            </p:panelGrid>

        </h:form>

    </ui:define>
</ui:composition>
