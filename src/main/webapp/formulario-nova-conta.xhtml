<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition
        template="/template.xhtml"
        xmlns="http://www.w3.org/1999/xhtml"
        xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
        xmlns:p="http://primefaces.org/ui"
        xmlns:h="http://java.sun.com/jsf/html"
        xmlns:f="http://java.sun.com/jsf/core">
    <ui:define name="title">
        Nova Conta
    </ui:define>

    <ui:define name="top">
        <h:outputText value="Bolão da Copa do Mundo 2026" style="font-size: x-large"/>
        <br/>
        Entretendo Palpiteiros da UFRA na Copa do Mundo de 2026
    </ui:define>

    <ui:define name="content">
        <h1>Criar Conta</h1>

        <br/>

        <h:form>
            <p:growl showSummary="true" showDetail="true"/>

            <p:panelGrid styleClass="ui-noborder"
                         columns="2"
                         rendered="#{novaContaBean.panelEmail}">

                <f:facet name="header">
                    <h2>Passo 1/3 - Informar e-mail válido</h2>
                </f:facet>

                <p:outputLabel value="E-mail"/>
                <p:inputText value="#{novaContaBean.email}" size="50">
                    <f:validator validatorId="emailUnicoValidator"/>
                    <f:validator validatorId="emailValidator"/>
                    <!-- <f:validator validatorId="emailUfraValidator"/> -->
                </p:inputText>

                <f:facet name="footer">
                    <p:commandButton value="Criar"
                                     icon="fa fa-plus"
                                     action="#{novaContaBean.enviarEmail()}"
                                     ajax="false"/>
                </f:facet>
            </p:panelGrid>

            <p:panelGrid styleClass="ui-noborder" columns="2" rendered="#{novaContaBean.panelCodigo}">

                <f:facet name="header">
                    <h2>Passo 2/3 - Validar e-mail</h2>
                </f:facet>

                <p:outputLabel value="Código"/>
                <p:inputText value="#{novaContaBean.codigoInformado}" size="7"/>

                <f:facet name="footer">
                    <p:commandButton value="Validar E-mail"
                                     icon="fa fa-check"
                                     action="#{novaContaBean.validarEmail()}"
                                     ajax="false"/>
                </f:facet>
            </p:panelGrid>

            <p:panelGrid styleClass="ui-noborder" columns="2" rendered="#{novaContaBean.panelFormulario}">

                <f:facet name="header">
                    <h2>Passo 3/3 - Criar novo usuário</h2>
                </f:facet>

                <p:outputLabel value="E-mail"/>
                <h:outputText value="#{novaContaBean.email}"/>

                <p:outputLabel value="Nome"/>
                <p:inputText value="#{novaContaBean.usuario.nome}" size="40"/>

                <p:outputLabel value="Sobrenome"/>
                <p:inputText value="#{novaContaBean.usuario.sobrenome}" size="40"/>

                <p:outputLabel value="Tipo"/>
                <p:selectOneMenu value="#{novaContaBean.usuario.tipo}">
                    <f:selectItem itemLabel="Selecione..." itemValue="" noSelectionOption="true"/>

                    <f:selectItem itemLabel="Discente (Aluno)" itemValue="DISCENTE"/>
                    <f:selectItem itemLabel="Docente (Professor)" itemValue="DOCENTE"/>
                    <f:selectItem itemLabel="Técnico (Funcionário)" itemValue="TECNICO"/>

                    <p:ajax update="menuCurso"/>
                </p:selectOneMenu>

                <p:outputLabel value="Campus"/>
                <p:selectOneMenu value="#{novaContaBean.usuario.campus}"
                                 converter="campusConverter">
                    <p:ajax event="change" update="menuCurso"/>
                    <f:selectItem itemLabel="Selecione..." itemValue="" noSelectionOption="true"/>
                    <f:selectItems value="#{campusBean.campi}" var="c" itemLabel="#{c.nome}" itemValue="#{c}"/>
                </p:selectOneMenu>

                <p:outputLabel value="Curso"/>
                <p:selectOneMenu id="menuCurso"
                                 value="#{novaContaBean.usuario.curso}"
                                 converter="cursoConverter"
                                 disabled="#{novaContaBean.usuario.tipo eq 'TECNICO' or novaContaBean.usuario.tipo eq 'DOCENTE'}">
                    <f:selectItem itemLabel="Selecione..." itemValue="" noSelectionOption="true"/>
                    <f:selectItems value="#{cursoBean.obterCursos(novaContaBean.usuario.campus)}"
                                   var="c"
                                   itemLabel="#{c.nome}"
                                   itemValue="#{c}"/>
                </p:selectOneMenu>

                <p:outputLabel value="Senha"/>
                <p:password id="pSenha1"
                            value="#{novaContaBean.usuario.senha}"
                            match="pSenha2"
                            validatorMessage="Senhas devem ser iguais"/>

                <p:outputLabel value="Confirme a Senha"/>
                <p:password id="pSenha2"
                            value="#{novaContaBean.senha}"/>

                <f:facet name="footer">
                    <p:commandButton value="Salvar Usuário"
                                     icon="fa fa-floppy-o"
                                     action="#{novaContaBean.criarConta()}"
                                     update="@form"/>
                </f:facet>
            </p:panelGrid>

        </h:form>

    </ui:define>
</ui:composition>
