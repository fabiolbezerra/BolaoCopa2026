<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition
        template="/template.xhtml"
        xmlns="http://www.w3.org/1999/xhtml"
        xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
        xmlns:p="http://primefaces.org/ui"
        xmlns:h="http://java.sun.com/jsf/html"
        xmlns:f="http://java.sun.com/jsf/core">

    <ui:define name="title">
        Bolão da Copa
    </ui:define>

    <ui:define name="top">
        <h:outputText value="Bolão da Copa do Mundo 2026"
                      style="font-size: x-large; font-weight: bold;"/>

        <p:outputPanel style="float: right;">
            <p:link value="Cadastrar" outcome="formulario-nova-conta.xhtml"/>
            <h:outputText value=" | "/>
            <p:link value="Entrar" outcome="login.xhtml"/>
        </p:outputPanel>
        <br/>
        <h:outputText value="Entretendo Palpiteiros da UFRA na Copa do Mundo de 2026"
                      style="font-style: italic; color: #555;"/>
    </ui:define>

    <!-- ======================= CONTEÚDO PRINCIPAL ======================= -->
    <ui:define name="content">

        <h1>Rankings</h1>

        <p:panel header="Top 10 Palpiteiros" style="margin-bottom: 30px;">
            <p:dataTable value="#{landpageBean.dezPrimeiros}"
                         var="usuario"
                         emptyMessage="Ainda não há rankings disponíveis."
                         rows="10"
                         paginator="false">

                <p:column headerText="Posição" style="width: 80px; text-align: center;">
                    <h:outputText value="#{usuario.posicao}"/>
                </p:column>

                <p:column headerText="Participante">
                    <h:outputText value="#{usuario.nome}"/>
                </p:column>

                <p:column headerText="Pontos" style="width: 100px; text-align: center; font-weight: bold;">
                    <h:outputText value="#{usuario.pontuacao}"/>
                </p:column>

                <p:column headerText="Campus / Curso">
                    <h:outputText value="#{usuario.campus.nome}"/>
                    <h:outputText value=" / #{usuario.curso.nome}" rendered="#{not empty usuario.curso}"/>
                </p:column>
            </p:dataTable>
        </p:panel>

        <h1>Próximas Partidas</h1>

        <p:panel header="Próximos Jogos">
            <p:outputLabel value="próximas partidas"
                           style="color: #888; font-style: italic;"/>
            <p:dataGrid value="#{landpageBean.proximosJogos}" var="jogo" columns="4">
                <p:panel header="#{jogo.local}" >
                    <h:outputText value="#{jogo.inicioDaPartida}">
                        <f:convertDateTime pattern="dd/MM/yyyy HH:mm"/>
                    </h:outputText>
                    <br/>
                    <p:outputPanel style="display: flex; justify-content: center; align-items: center;">
                        <p:graphicImage value="/resources/imagens/#{jogo.selecaoA.simbolo}" width="24px" style="padding: 5px"/>
                        <h:outputText value=" #{jogo.selecaoA.sigla} "/>
                        x
                        <h:outputText value=" #{jogo.selecaoB.sigla} "/>
                        <p:graphicImage value="/resources/imagens/#{jogo.selecaoB.simbolo}" width="24px" style="padding: 5px"/>
                    </p:outputPanel>
                    <br/>
                </p:panel>
            </p:dataGrid>
        </p:panel>

    </ui:define>

</ui:composition>
